name: CI JanguBi Backend

on:
  push:
    # Qualité seule. Livraison : push `stage` et tags `v*` →
    # .github/workflows/livraison-recette.yml (runner ceac, contrat de
    # l'Infrastructure Ecosysteme-Startup).
    branches:
      - main
      - develop
    # Les changements purement documentaires ne déclenchent pas la CI.
    paths-ignore: ['docs/**', '**/*.md', 'graphify-out/**']

  pull_request:
    branches:
      - main
      - develop
      - stage
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ['docs/**', '**/*.md', 'graphify-out/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build:
    # Les PR en brouillon ne consomment pas de minutes GitHub Actions.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04              

    services:
      postgres:
        image: pgvector/pgvector:pg17 
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jangubi_test
        ports:
          # Port hôte surchargeable pour `make act` (un Postgres local occupe
          # souvent 5432) ; sur GitHub, la variable n'existe pas → 5432.
          - ${{ vars.CI_PG_HOST_PORT || '5432' }}:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine         
        ports:
          - ${{ vars.CI_REDIS_HOST_PORT || '6379' }}:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 #v6.0.3

      - uses: actions/setup-python@28f2168f4d98ee0445e3c6321f6e6616c83dd5ec #v6.2.0
        with:
          python-version: "3.12.4"
          cache: "pip"
          cache-dependency-path: |
            requirements/local.txt
            requirements/base.txt

      - name: Cache pip agressif
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #v6.1.0
        with:
          path: /opt/hostedtoolcache/Python/3.12.4/x64/
          key: python-${{ hashFiles('requirements/local.txt') }}-${{ hashFiles('requirements/base.txt') }}

      - name: Install ffmpeg
        # Encodage audio réel dans les tests de la sonothèque (apps/audio).
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install dependencies
        run: pip install -r requirements/local.txt

      - name: Run ruff
        run: ruff check apps/

      - name: Type check
        run: mypy --config mypy.ini apps/

      - name: Run tests
        env:
          DJANGO_SETTINGS_MODULE: config.django.test
          SECRET_KEY: "ci-only-secret-key-not-for-production"
          DATABASE_URL: postgres://postgres:postgres@localhost:${{ vars.CI_PG_HOST_PORT || '5432' }}/jangubi_test
          REDIS_URL: redis://localhost:${{ vars.CI_REDIS_HOST_PORT || '6379' }}/0
          CELERY_TASK_ALWAYS_EAGER: "True"         
          CELERY_TASK_EAGER_PROPAGATES: "True"
        run: pytest apps/ -v --tb=short
