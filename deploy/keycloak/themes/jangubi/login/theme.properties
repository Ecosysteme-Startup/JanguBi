# Thème de connexion Jàngu Bi, logo officiel et favicon dans resources/img (maquettes « Ciel produit » : WEB-Connexion, WEB-Inscription-Compte).
# Hérite de « base » : les pages réécrites ici (connexion, inscription, OTP, mot de passe oublié et mise à jour,
# vérification d'e-mail, expiration, erreur, information, choix de méthode, déconnexion, profil) suivent la
# maquette ; toute autre page de base prend notre gabarit (carte centrée) et nos classes.
parent=base
import=common/keycloak
locales=fr
styles=css/jangubi.css
scripts=js/jangubi.js

# Adresse du site web (liens du logo, du pied de page, de la page d'erreur). Les pages
# ouvertes par le client web prennent son adresse (baseUrl du client jangubi-web) ;
# ce réglage ne sert qu'en repli (client mobile, pages sans client).
jbWebUrl=${env.KC_WEB_ORIGIN:http://localhost:3000}

kcHtmlClass=jb-html
kcBodyClass=jb-body
kcFormClass=jb-form
kcFormGroupClass=jb-group
kcLabelWrapperClass=jb-label-wrap
kcLabelClass=jb-label
kcInputWrapperClass=jb-input-wrap
kcInputClass=jb-input
kcInputGroup=jb-input-group
kcInputErrorMessageClass=jb-error
kcInputHelperTextBeforeClass=jb-hint
kcInputHelperTextAfterClass=jb-hint
kcFormOptionsClass=jb-options
kcFormOptionsWrapperClass=jb-options-wrap
kcFormSettingClass=jb-settings
kcFormButtonsClass=jb-buttons
kcButtonClass=jb-btn
kcButtonPrimaryClass=jb-btn-primary
kcButtonDefaultClass=jb-btn-outline
kcButtonBlockClass=jb-btn-block
kcButtonLargeClass=
kcAlertClass=jb-alert
kcAlertTitleClass=jb-alert-title
kcFormPasswordVisibilityButtonClass=jb-eye
kcFormPasswordVisibilityIconShow=jb-eye-show
kcFormPasswordVisibilityIconHide=jb-eye-hide
kcContentWrapperClass=jb-required-note
kcLoginOTPListClass=jb-otp-device
kcLoginOTPListInputClass=jb-otp-radio
kcSelectAuthListClass=jb-select-list
kcSelectAuthListItemClass=jb-select-item
kcCheckboxInputClass=jb-checkbox
