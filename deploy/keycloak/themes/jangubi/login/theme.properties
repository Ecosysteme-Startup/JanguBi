# Thème de connexion de Jàngu Bi (realms `jangubi` et `jangubi-staging`).
# Hérite du thème `keycloak` : seules les couleurs et les textes changent.
parent=keycloak
import=common/keycloak

# `styles` n'est pas cumulatif : redéclarer les feuilles du parent, puis la nôtre.
styles=css/login.css css/tile.css css/jangubi.css

locales=fr,en
