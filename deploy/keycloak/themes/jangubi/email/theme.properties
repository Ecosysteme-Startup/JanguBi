# Thème des e-mails Keycloak de Jàngu Bi (vérification d'adresse, mot de passe oublié, actions
# demandées, changement d'adresse, alertes de sécurité). Même mise en page que les e-mails de
# l'API (apps/templates/emails/base.html) : tableaux de 600 px, CSS en ligne, version texte.
# Les modèles non réécrits ici (verrouillage, invitation d'organisation…) prennent le texte
# du thème base dans notre gabarit.
parent=base
locales=fr,en

# Logo : PNG à une adresse publique absolue (les clients mail bloquent le SVG). Recette :
# https://api-jangubi.ceac.dev/static/emails/logo-email.png. Vide : image du thème
# (resources/img/logo-email.png, servie par Keycloak sous ${url.resourcesUrl}).
logoUrl=${env.JANGUBI_EMAIL_LOGO_URL:}

# Adresse du site web (liens du pied de page). Vide : pas de liens.
jbWebUrl=${env.KC_WEB_ORIGIN:}
