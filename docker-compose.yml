# ==============================================================================
# Configuration de base pour les services applicatifs (Django, Celery, Beats)
# Cela évite de répéter le build, les volumes et l'environnement partout.
# ==============================================================================
x-app-base: &app-base
  build:
    context: .
    dockerfile: docker/local.Dockerfile
  volumes:
    - .:/app
  env_file:
    - .env
  depends_on:
    db:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: on-failure
  networks:
    - app_network

services:
  # ===========================================
  # Reverse Proxy & Load Balancer (Traefik)
  # ===========================================
  traefik:
    image: traefik:latest
    container_name: traefik
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.email=${TRAEFIK_ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--log.level=INFO"
    ports:
      #- "8080:80"
      - "8085:80"
      - "8443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_letsencrypt:/letsencrypt
    networks:
      - app_network
    restart: on-failure

  # ===========================================
  # Base de données
  # ===========================================
  db:
    image: pgvector/pgvector:pg17
    environment:
      # Bonne pratique : On utilise les variables du .env plutôt que de les écrire en dur
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      # On utilise aussi l'interpolation ici pour le check
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  # ===========================================
  # Message Broker
  # ===========================================
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  # ===========================================
  # Cache & Résultats Celery
  # ===========================================
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  # ===========================================
  # Stockage S3 Local
  # ===========================================
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      # On utilise les variables du .env
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "9002:9000" # API
      - "9091:9001" # Console Web
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  # ===========================================
  # Serveur SMTP de dev (MailHog)
  # ===========================================
  # Piège à e-mails de dev (Django ET Keycloak) : tout est capturé, rien ne part.
  # Interface http://localhost:8025, API REST http://localhost:8025/api/v1/messages (tests e2e).
  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
      MP_MAX_MESSAGES: "2000"
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Interface web + API
    networks:
      - app_network

  # ===========================================
  # Application Django Principale
  # ===========================================
  django:
    <<: *app-base
    container_name: django_web
    entrypoint: ["/docker-entrypoint.sh"]
    #command: python manage.py runserver 0.0.0.0:8000
    command: daphne -b 0.0.0.0 -p 8000 config.asgi:application
    ports:
      - "8001:8000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.django.rule=Host(`jangubi.thenexcom.com`)"
      - "traefik.http.routers.django.entrypoints=websecure"
      - "traefik.http.routers.django.tls=true"
      - "traefik.http.routers.django.tls.certresolver=letsencrypt"
      - "traefik.http.services.django.loadbalancer.server.port=8000"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      traefik:
        condition: service_started

  # ===========================================
  # Workers Asynchrones
  # ===========================================
  celery:
    <<: *app-base
    container_name: celery_worker
    command: celery -A apps.tasks worker -l info --concurrency=1 --without-gossip --without-mingle --without-heartbeat

  # ===========================================
  # Planificateur Tâches
  # ===========================================
  beats:
    <<: *app-base
    container_name: celery_beat
    # Aligné sur la prod (Procfile) : planning stocké en base Postgres via
    # django-celery-beat, pas dans un fichier gdbm local. Évite l'erreur de
    # file-locking sur le bind mount Docker Desktop (FS "fakeowner").
    command: celery -A apps.tasks beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler

  # ===========================================
  # Keycloak (ADR-004) — profil « keycloak » : make kc-up
  # ===========================================
  keycloak-db:
    image: postgres:17-alpine
    profiles: ["keycloak"]
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    profiles: ["keycloak"]
    container_name: keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
      # Substitués dans infra/keycloak/realm-jangubi.json à l'import.
      # Aucun secret par défaut : make kc-up refuse de démarrer sans KEYCLOAK_ADMIN_CLIENT_SECRET.
      KC_ADMIN_SYNC_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:-}
      KC_WEB_REDIRECT_URI: ${KC_WEB_REDIRECT_URI:-http://localhost:3000/api/auth/callback/keycloak}
      KC_MOBILE_REDIRECT_URI: ${KC_MOBILE_REDIRECT_URI:-sn.numerisen.jangubi://oauth}
      KC_WEB_POST_LOGOUT_URI: ${KC_WEB_POST_LOGOUT_URI:-http://localhost:3000/}
      KC_WEB_ORIGIN: ${KC_WEB_ORIGIN:-http://localhost:3000}
      # Lu par le thème de connexion (bandeau liturgique).
      JANGUBI_API_URL: ${JANGUBI_API_URL:-http://localhost:8001/api/v1}
      # SMTP du realm (vérification d'e-mail, mot de passe oublié) : Mailpit en dev.
      KC_SMTP_HOST: ${KC_SMTP_HOST:-mailpit}
      KC_SMTP_PORT: ${KC_SMTP_PORT:-1025}
      KC_SMTP_FROM: ${KC_SMTP_FROM:-noreply@jangubi.sn}
      KC_SMTP_STARTTLS: ${KC_SMTP_STARTTLS:-false}
      KC_SMTP_AUTH: ${KC_SMTP_AUTH:-false}
      KC_SMTP_USER: ${KC_SMTP_USER:-}
      KC_SMTP_PASSWORD: ${KC_SMTP_PASSWORD:-}
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
      # Thème de connexion Jàngu Bi (maquettes PUB-Connexion, PUB-Inscription-Compte).
      - ./infra/keycloak/themes/jangubi:/opt/keycloak/themes/jangubi:ro
    ports:
      - "8180:8080"
    depends_on:
      keycloak-db:
        condition: service_healthy
    networks:
      - app_network

volumes:
  keycloak_db_data:
  traefik_letsencrypt:
  minio_data:
  postgres_data:
  redis_data:
  rabbitmq_data:

networks:
  app_network:
    driver: bridge
