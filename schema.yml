openapi: 3.0.3
info:
  title: JanguBi API
  version: 1.0.0
  description: API for JanguBi
paths:
  /api/v1/agenda/:
    get:
      operationId: agenda_list
      description: À placer en premier dans les bases des vues V1.
      summary: 'Événements à venir (filtres : nœud et sous-arbre, période, type)'
      parameters:
      - in: query
        name: date_from
        schema:
          type: string
          format: date-time
        description: 'Par défaut : maintenant'
      - in: query
        name: date_to
        schema:
          type: string
          format: date-time
      - in: query
        name: limit
        schema:
          type: integer
        description: Nombre de résultats (défaut 10, max 50)
      - in: query
        name: node
        schema:
          type: string
          format: uuid
        description: Nœud (et son sous-arbre)
      - in: query
        name: offset
        schema:
          type: integer
        description: Décalage
      - in: query
        name: type
        schema:
          enum:
          - mass
          - conference
          - retreat
          - ordination
          - other
          type: string
          minLength: 1
        description: |-
          * `mass` - Messe
          * `conference` - Conférence
          * `retreat` - Retraite
          * `ordination` - Ordination
          * `other` - Autre
      tags:
      - agenda
      security:
      - keycloakBearer: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEventOutputList'
          description: ''
  /api/v1/agenda/{event_id}/:
    get:
      operationId: v1_agenda_retrieve
      description: À placer en premier dans les bases des vues V1.
      summary: Détail d'un événement
      parameters:
      - in: path
        name: event_id
        schema:
          type: integer
        required: true
      tags:
      - agenda
      security:
      - keycloakBearer: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventOutput'
          description: ''
  /api/v1/agenda/{event_id}/register/:
    post:
      operationId: v1_agenda_register_create
      description: À placer en premier dans les bases des vues V1.
      summary: S'inscrire ou mettre à jour son inscription (400 si clos ; 409 si complet)
      parameters:
      - in: path
        name: event_id
        schema:
          type: integer
        required: true
      tags:
      - agenda
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterInput'
      security:
      - keycloakBearer: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventOutput'
          description: ''
        '409':
          description: Événement complet ou places insuffisantes
    delete:
      operationId: v1_agenda_register_destroy
      description: À placer en premier dans les bases des vues V1.
      summary: Se désinscrire
      parameters:
      - in: path
        name: event_id
        schema:
          type: integer
        required: true
      tags:
      - agenda
      security:
      - keycloakBearer: []
      responses:
        '204':
          description: No response body
  /api/v1/audio/albums/:
    get:
      operationId: audio_albums_list
      description: 'Sonothèque paroissiale (contrat : docs/API-AUDIO.md).'
      summary: Albums visibles (messes, homélies, retraites…)
      parameters:
      - in: query
        name: kind
        schema:
          enum:
          - album
          - messe
          - homelies
          - retraite
          type: string
          minLength: 1
        description: |-
          * `album` - Album
          * `messe` - Messe enregistrée
          * `homelies` - Série d'homélies
          * `retraite` - Retraite
      - in: query
        name: source
        schema:
          type: string
          format: uuid
      tags:
      - audio
      security:
      - keycloakBearer: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AudioAlbum'
          description: ''
    post:
      operationId: audio_albums_create
      description: 'Sonothèque paroissiale (contrat : docs/API-AUDIO.md).'
      summary: Créer un album (brouillon)
      tags:
      - audio
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AudioAlbumInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AudioAlbumInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AudioAlbumInput'
        required: true
      security:
      - keycloakBearer: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudioAlbum'
          description: ''
        '403':
          description: Capacité audio.publier / audio.moderer requise sur le nœud
  /api/v1/audio/albums/{album_id}/:
    get:
      operationId: audio_albums_retrieve
      description: 'Sonothèque paroissiale (contrat : docs/API-AUDIO.md).'
      summary: Page d'album et ses pistes
      parameters:
      - in: path
        name: album_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - audio
      security:
      - keycloakBearer: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudioAlbumDetail'
          description: ''
        '404':
          description: Introuvable, ou non visible pour vous
    patch:
      operationId: audio_albums_update
      description: 'Sonothèque paroissiale (contrat : docs/API-AUDIO.md).'
      summary: Modifier un album (la visibilité s'applique à ses pistes)
      parameters:
      - in: path
        name: album_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - audio
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAudioAlbumUpdateInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAudioAlbumUpdateInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAudioAlbumUpdateInput'
      security:
      - keycloakBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudioAlbum'
          description: ''
        '403':
          description: Capacité audio.publier / audio.moderer requise sur le nœud
  /api/v1/audio/albums/{album_id}/publier/:
    post:
      operationId: audio_albums_publish
      description: 'Sonothèque paroissiale (contrat : docs/API-AUDIO.md).'
