      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudioAlbum'
          description: ''
        '403':
          description: Capacité audio.publier / audio.moderer requise sur le nœud
  /api/v1/audio/bibliotheque/:
