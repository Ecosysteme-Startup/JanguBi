openapi: 3.0.3
info:
  title: JanguBi API
  version: 1.0.0
  description: API for JanguBi
paths:
  /api/v1/agenda/:
    get:
      operationId: agenda_list
      description: À placer en premier dans les bases des vues V1.
      summary: 'Événements à venir (filtres : nœud et sous-arbre, période, type)'
      parameters:
      - in: query
        name: date_from
        schema:
          type: string
          format: date-time
        description: 'Par défaut : maintenant'
      - in: query
        name: date_to
        schema:
          type: string
          format: date-time
      - in: query
        name: limit
        schema:
          type: integer
        description: Nombre de résultats (défaut 10, max 50)
      - in: query
        name: node
        schema:
          type: string
          format: uuid
        description: Nœud (et son sous-arbre)
      - in: query
        name: offset
        schema:
          type: integer
        description: Décalage
      - in: query
        name: type
        schema:
          enum:
          - mass
          - conference
          - retreat
          - ordination
          - other
          type: string
          minLength: 1
        description: |-
          * `mass` - Messe
          * `conference` - Conférence
          * `retreat` - Retraite
          * `ordination` - Ordination
          * `other` - Autre
      tags:
      - agenda
      security:
      - keycloakBearer: []
      - legacyJwt: []
      - session: []
      - sessionHeader: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEventOutputList'
          description: ''
  /api/v1/agenda/{event_id}/:
    get:
      operationId: v1_agenda_retrieve
      description: À placer en premier dans les bases des vues V1.
      summary: Détail d'un événement
      parameters:
      - in: path
        name: event_id
        schema:
          type: integer
        required: true
      tags:
      - agenda
      security:
      - keycloakBearer: []
      - legacyJwt: []
      - session: []
      - sessionHeader: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventOutput'
          description: ''
  /api/v1/agenda/{event_id}/register/:
    post:
      operationId: v1_agenda_register_create
      description: À placer en premier dans les bases des vues V1.
      summary: S'inscrire (409 si complet ; idempotent)
      parameters:
      - in: path
        name: event_id
        schema:
          type: integer
        required: true
      tags:
      - agenda
      security:
      - keycloakBearer: []
      - legacyJwt: []
      - session: []
      - sessionHeader: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventOutput'
          description: ''
        '409':
          description: Événement complet
    delete:
      operationId: v1_agenda_register_destroy
      description: À placer en premier dans les bases des vues V1.
      summary: Se désinscrire
      parameters:
      - in: path
        name: event_id
        schema:
          type: integer
        required: true
      tags:
      - agenda
      security:
      - keycloakBearer: []
      - legacyJwt: []
      - session: []
      - sessionHeader: []
      responses:
        '204':
          description: No response body
  /api/v1/audit/:
    get:
      operationId: audit_events_list
      description: À placer en premier dans les bases des vues V1.
      summary: Journal d'audit (audit.voir sur un nœud, ou plateforme)
      parameters:
      - in: query
        name: action
        schema:
          type: string
          minLength: 1
        description: Préfixe (ex. office.)
      - in: query
        name: actor
        schema:
          type: string
          format: uuid
      - in: query
        name: date_from
        schema:
          type: string
          format: date
      - in: query
        name: date_to
        schema:
          type: string
          format: date
      - in: query
        name: limit
        schema:
          type: integer
        description: Nombre de résultats (défaut 10, max 50)
      - in: query
        name: node
        schema:
          type: string
          format: uuid
      - in: query
        name: offset
        schema:
          type: integer
        description: Décalage
      tags:
      - audit
      security:
      - keycloakBearer: []
      - legacyJwt: []
      - session: []
      - sessionHeader: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditEventOutputList'
          description: ''
  /api/v1/auth/jwt/login/:
    post:
      operationId: v1_auth_jwt_login_create
      description: |-
        Authentifie l'utilisateur et retourne un access token (30 min par défaut, réglable via JWT_ACCESS_TOKEN_LIFETIME_MINUTES) et un refresh token (7 jours). Le compte doit être actif ET l'email vérifié.

        Avec l'en-tête `X-Auth-Transport: cookie`, le refresh token est posé dans un cookie HttpOnly et **omis du corps de réponse** — il devient alors illisible depuis JavaScript.
      summary: Connexion JWT
      parameters:
      - in: header
        name: X-Auth-Transport
        schema:
          type: string
          enum:
          - cookie
        description: Transport souhaité pour le refresh token. Avec la valeur `cookie`
          (clients navigateur), le jeton est posé dans un cookie HttpOnly et **omis
          du corps de réponse**. Sans cet en-tête (clients natifs / mobile), le jeton
          est renvoyé dans le corps comme auparavant.
      tags:
      - Authentification
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserJwtLoginInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserJwtLoginInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserJwtLoginInput'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserJwtLoginOutput'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/auth/jwt/logout/:
    post:
      operationId: v1_auth_jwt_logout_create
      description: Blackliste le refresh token, lu **en priorité dans le cookie HttpOnly**
        avec repli sur le corps de requête, puis efface le cookie. L'access token
        reste valide jusqu'à son expiration naturelle (30 min max par défaut). Pour
        révoquer tous les appareils, utiliser /logout-all/.
      summary: Déconnexion (appareil courant)
      parameters:
      - in: header
        name: X-Auth-Transport
        schema:
          type: string
          enum:
          - cookie
        description: Transport souhaité pour le refresh token. Avec la valeur `cookie`
          (clients navigateur), le jeton est posé dans un cookie HttpOnly et **omis
          du corps de réponse**. Sans cet en-tête (clients natifs / mobile), le jeton
          est renvoyé dans le corps comme auparavant.
      tags:
      - Authentification
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserJwtLogoutInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserJwtLogoutInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserJwtLogoutInput'
      security:
      - keycloakBearer: []
      - legacyJwt: []
      - session: []
      - sessionHeader: []
      responses:
        '204':
          description: Déconnexion réussie
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/auth/jwt/logout-all/:
    post:
      operationId: v1_auth_jwt_logout_all_create
      description: Invalide TOUS les JWT actifs de l'utilisateur via rotation du jwt_key,
        et efface le cookie de refresh de l'appareil courant. Utile en cas de suspicion
        de compromission.
      summary: Déconnexion de tous les appareils
      parameters:
      - in: header
        name: X-Auth-Transport
        schema:
          type: string
          enum:
          - cookie
        description: Transport souhaité pour le refresh token. Avec la valeur `cookie`
          (clients navigateur), le jeton est posé dans un cookie HttpOnly et **omis
          du corps de réponse**. Sans cet en-tête (clients natifs / mobile), le jeton
          est renvoyé dans le corps comme auparavant.
      tags:
      - Authentification
      security:
      - keycloakBearer: []
      - legacyJwt: []
      - session: []
      - sessionHeader: []
      responses:
        '204':
          description: Tous les appareils déconnectés
  /api/v1/auth/jwt/refresh/:
    post:
      operationId: v1_auth_jwt_refresh_create
      description: |-
        Échange un refresh token valide contre un nouveau access token.

        Le jeton est lu **en priorité dans le cookie HttpOnly**, avec repli sur le champ `refresh` du corps (clients natifs / mobile). La rotation étant active (`ROTATE_REFRESH_TOKENS`), le nouveau jeton remplace le cookie.
      summary: Renouvellement du access token
      parameters:
      - in: header
        name: X-Auth-Transport
        schema:
          type: string
          enum:
          - cookie
        description: Transport souhaité pour le refresh token. Avec la valeur `cookie`
          (clients navigateur), le jeton est posé dans un cookie HttpOnly et **omis
          du corps de réponse**. Sans cet en-tête (clients natifs / mobile), le jeton
          est renvoyé dans le corps comme auparavant.
      tags:
      - Authentification
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserJwtRefreshInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserJwtRefreshInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserJwtRefreshInput'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserJwtRefreshOutput'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/auth/me/:
    get:
      operationId: v1_auth_me_retrieve
      description: Retourne les données complètes de l'utilisateur authentifié (ID,
        email, rôle, etc.).
      summary: Profil utilisateur connecté
      tags:
      - Authentification
      security:
      - keycloakBearer: []
      - legacyJwt: []
      - session: []
      - sessionHeader: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonProfil'
              examples:
                ExempleFidèle:
                  value:
                    id: 1
                    email: jean.dupont@example.com
                    role: fidele
                    pastoral_role: null
                    onboarding_state: completed
                    is_active: true
                    is_verified: true
                    is_admin: false
                    is_staff: false
                    diocese:
                      id: 2
                      name: Diocèse de Thiès
                    province:
                      id: 1
                      name: Province de Dakar
                    profile:
                      first_name: Jean
                      last_name: Dupont
                      title: MR
                      phone: '+221770000000'
                      primary_parish:
                        id: 5
                        name: Paroisse Saint-Pierre
                      avatar: null
                  summary: Exemple Fidèle
          description: ''
  /api/v1/bible/books/:
    get:
      operationId: v1_bible_books_list
      description: Returns paginated list of all books, optionally filtered by testament
        and searched by name.
      summary: List all books with optional testament filter and name search
      parameters:
      - in: query
        name: limit
        schema:
          type: integer
        description: Number of results to return per page.
      - in: query
        name: offset
        schema:
          type: integer
        description: The initial index from which to return the results.
      - in: query
        name: search
        schema:
          type: string
          nullable: true
      - in: query
        name: testament
        schema:
          type: string
          nullable: true
      tags:
      - Bible
      security:
      - keycloakBearer: []
      - legacyJwt: []
      - session: []
      - sessionHeader: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookMetadataOutput'
          description: ''
  /api/v1/bible/books/{book_id}/:
    get:
      operationId: v1_bible_books_retrieve
      description: Returns metadata for a specific book, optionally expanding chapters.
      summary: Get book metadata
      parameters:
      - in: path
        name: book_id
        schema:
          type: integer
        required: true
      - in: query
        name: expand
        schema:
          type: string
        description: Pass 'chapters' to include chapters metadata
      tags:
      - Bible
      security:
      - keycloakBearer: []
      - legacyJwt: []
      - session: []
      - sessionHeader: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookDetailOutput'
          description: ''
  /api/v1/bible/books/{book_id}/chapters/:
    get:
      operationId: v1_bible_books_chapters_list
      description: Returns list of chapters for a book.
      summary: List chapters for a specific book
      parameters:
      - in: path
        name: book_id
        schema:
          type: integer
        required: true
      tags:
      - Bible
      security:
      - keycloakBearer: []
      - legacyJwt: []
      - session: []
      - sessionHeader: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChapterMetadataOutput'
          description: ''
  /api/v1/bible/books/{book_id}/chapters/{chapter_number}/verses/:
    get:
      operationId: v1_bible_books_chapters_verses_list
      description: Returns list of verses for a specific chapter.
      summary: List verses for a specific chapter
      parameters:
      - in: path
        name: book_id
        schema:
          type: integer
        required: true
      - in: path
        name: chapter_number
        schema:
          type: integer
        required: true
      - in: query
        name: excerpt
        schema:
          type: boolean
          default: false
      - in: query
        name: limit
        schema:
          type: integer
        description: Number of results to return per page.
      - in: query
        name: offset
        schema:
          type: integer
        description: The initial index from which to return the results.
      - in: query
        name: source
        schema:
          type: string
          nullable: true
      - in: query
        name: verses
        schema:
          type: string
          nullable: true
      tags:
      - Bible
      security:
      - keycloakBearer: []
      - legacyJwt: []
      - session: []
      - sessionHeader: []
