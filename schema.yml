  /api/v1/audio/evenements/:
    post:
      operationId: audio_events_create
      description: 'Compte facultatif : un jeton valide ouvre les contenus « paroisse
        » et « privé » autorisés.'
      summary: Événements d'écoute par lot (100 au plus), idempotents par client_event_id
      tags:
      - audio
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AudioEventsInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AudioEventsInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AudioEventsInput'
        required: true
      security:
      - keycloakBearer: []
      - {}
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudioEventsResult'
          description: ''
  /api/v1/audio/lecture/etat/:
    get:
      operationId: audio_playback_state_get
      description: 'Sonothèque paroissiale (contrat : docs/API-AUDIO.md).'
      summary: Dernière écoute (« Reprendre sur cet appareil »)
      tags:
