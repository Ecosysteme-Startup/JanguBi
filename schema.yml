    delete:
      operationId: audio_tracks_unlike
      description: 'Sonothèque paroissiale (contrat : docs/API-AUDIO.md).'
      summary: Ne plus aimer une piste
      parameters:
      - in: path
        name: track_id
        schema:
          type: string
          format: uuid
        required: true
