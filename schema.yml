components:
  schemas:
    AccountDetailOutput:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        full_name:
          type: string
        realm_role:
          $ref: '#/components/schemas/AccountRealmRoleEnum'
        mfa:
          $ref: '#/components/schemas/AccountMfaEnum'
        last_login:
          type: string
          format: date-time
          nullable: true
          description: Dernière activité connue
        status:
          $ref: '#/components/schemas/AccountStatusEnum'
        node_label:
          type: string
          nullable: true
          description: Nœud de la nomination principale, ou paroisse suivie
        keycloak_id:
          type: string
          nullable: true
        email_verified:
          type: boolean
        offices:
          type: array
          items:
            $ref: '#/components/schemas/AccountOffice'
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/AccountSession'
      required:
      - email
      - email_verified
      - full_name
      - id
      - keycloak_id
      - last_login
      - mfa
      - node_label
      - offices
      - realm_role
      - sessions
      - status
    AccountMfaEnum:
      enum:
      - totp
      - webauthn
      - facultative
      type: string
      description: |-
        * `totp` - totp
        * `webauthn` - webauthn
        * `facultative` - facultative
    AccountOffice:
      type: object
      properties:
        office_label:
          type: string
        node_name:
          type: string
        start_date:
          type: string
          format: date
        capabilities:
          type: array
          items:
            type: string
      required:
      - capabilities
      - node_name
      - office_label
      - start_date
    AccountOutput:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        full_name:
          type: string
        realm_role:
          $ref: '#/components/schemas/AccountRealmRoleEnum'
        mfa:
          $ref: '#/components/schemas/AccountMfaEnum'
        last_login:
          type: string
          format: date-time
          nullable: true
          description: Dernière activité connue
        status:
          $ref: '#/components/schemas/AccountStatusEnum'
        node_label:
          type: string
          nullable: true
          description: Nœud de la nomination principale, ou paroisse suivie
      required:
      - email
      - full_name
      - id
      - last_login
      - mfa
      - node_label
      - realm_role
      - status
    AccountRealmRoleEnum:
      enum:
      - fidele
      - staff
      - platform_admin
      type: string
      description: |-
        * `fidele` - fidele
        * `staff` - staff
        * `platform_admin` - platform_admin
    AccountSession:
      type: object
      properties:
        id:
          type: string
        client:
          type: string
        ip:
          type: string
          nullable: true
        started_at:
          type: string
          format: date-time
          nullable: true
      required:
      - client
      - id
      - ip
      - started_at
    AccountStatusEnum:
      enum:
      - actif
      - verrouille
      - a_confirmer
      type: string
      description: |-
        * `actif` - actif
        * `verrouille` - verrouille
        * `a_confirmer` - a_confirmer
    ActionEnum:
      enum:
      - terminer
      - annuler
      - qualifier
      type: string
      description: |-
        * `terminer` - terminer
        * `annuler` - annuler
        * `qualifier` - qualifier
    Activation:
      type: object
      properties:
        node:
          $ref: '#/components/schemas/NodeBrief'
        enabled:
          type: boolean
          title: Collecte active
        authorization_ref:
          type: string
          title: Référence de l'autorisation
          maxLength: 120
        authorization_date:
          type: string
          format: date
          nullable: true
          title: Date de l'autorisation
        authorization_text:
          type: string
          title: Mention affichée
          description: 'Ex. « Collecte autorisée par l''Archevêché de Dakar (réf.
            …) ». Vide : texte par défaut.'
          maxLength: 300
        allocation_key:
          type: string
          title: Clé d'affectation
          maxLength: 64
        receipt_prefix:
          type: string
          title: Préfixe des reçus
          maxLength: 8
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - node
      - updated_at
    ActivationInput:
      type: object
      properties:
        node:
          type: string
          format: uuid
        enabled:
          type: boolean
        authorization_ref:
          type: string
          default: ''
          maxLength: 120
        authorization_date:
          type: string
          format: date
          nullable: true
        authorization_text:
          type: string
          default: ''
          maxLength: 300
        allocation_key:
          type: string
          default: ''
          maxLength: 64
        receipt_prefix:
          type: string
          default: ''
          description: Ex. « SD » → SD-2026-00147
          pattern: ^[A-Za-z0-9]{0,8}$
      required:
      - enabled
      - node
    ArticleContentTypeEnum:
      enum:
      - announcement
      - article
      - pastoral_letter
      - meditation
      type: string
      description: |-
        * `announcement` - Annonce
        * `article` - Article
        * `pastoral_letter` - Lettre Pastorale
        * `meditation` - Méditation du jour
    ArticleCreateInput:
      type: object
      properties:
        node_id:
          type: string
