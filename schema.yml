      security:
      - keycloakBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudioPlaybackState'
          description: ''
        '204':
          description: Aucune écoute
    put:
      operationId: audio_playback_state_put
      description: 'Sonothèque paroissiale (contrat : docs/API-AUDIO.md).'
      summary: Position courante (toutes les 15 s, à la pause, à la fermeture) ; dernière
