                  $ref: '#/components/schemas/VerseOutput'
          description: ''
  /api/v1/bible/daily-texts/:
    get:
      operationId: v1_bible_daily_texts_list
      description: Returns AELF daily texts.
      summary: Get paginated list of AELF daily texts
      parameters:
      - in: query
        name: limit
        schema:
          type: integer
        description: Number of results to return per page.
      - in: query
        name: offset
        schema:
          type: integer
        description: The initial index from which to return the results.
      tags:
      - Bible
      security:
      - keycloakBearer: []
      - legacyJwt: []
      - session: []
      - sessionHeader: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DailyTextOutput'
          description: ''
  /api/v1/bible/import/:
    post:
      operationId: v1_bible_import_create
      description: Admin-only endpoint to trigger a background import.
      summary: Trigger background import of Bible texts
      tags:
      - Bible
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BibleImportInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BibleImportInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BibleImportInput'
        required: true
      security:
      - keycloakBearer: []
      - legacyJwt: []
      - session: []
      - sessionHeader: []
      responses:
        '202':
          description: 'Import enqueued — `{"status": ...}`'
        '400':
          description: 'Nom de fichier invalide (chemin de répertoire interdit) —
            `{"error": ...}`'
        '403':
          description: 'Réservé aux super-utilisateurs — `{"error": ...}`'
        '404':
          description: 'Fichier introuvable dans le dossier d''importation — `{"error":
            ...}`'
  /api/v1/bible/search/:
    get:
      operationId: v1_bible_search_list
      description: Search endpoint using lexical/hybrid search.
      summary: Lexical and hybrid search across all verses
      parameters:
      - in: query
        name: book_slug
        schema:
          type: string
          nullable: true
      - in: query
        name: chapter_number
        schema:
          type: integer
          nullable: true
      - in: query
        name: hybrid
        schema:
          type: boolean
          default: false
      - in: query
        name: limit
        schema:
          type: integer
          maximum: 500
          default: 50
      - in: query
        name: q
        schema:
          type: string
          maxLength: 300
          minLength: 3
        required: true
      - in: query
        name: source
        schema:
          type: string
          nullable: true
      - in: query
        name: testament
        schema:
          type: string
          nullable: true
      tags:
      - Bible
      security:
      - keycloakBearer: []
      - legacyJwt: []
      - session: []
      - sessionHeader: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SearchBookGroupOutput'
          description: ''
  /api/v1/bible/testaments/:
    get:
      operationId: v1_bible_testaments_list
      description: Returns the lists of testaments (Ancien & Nouveau) with nested
        books.
      summary: List testaments with nested books
      tags:
      - Bible
      security:
      - keycloakBearer: []
      - legacyJwt: []
      - session: []
      - sessionHeader: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TestamentWithBooksOutput'
          description: ''
  /api/v1/bible/testaments/{testament_slug}/books/:
    get:
      operationId: v1_bible_testaments_books_list
      description: Returns all books for a given testament.
      summary: List all books for a specific testament
      parameters:
      - in: path
        name: testament_slug
        schema:
          type: string
        required: true
      tags:
      - Bible
      security:
      - keycloakBearer: []
      - legacyJwt: []
      - session: []
      - sessionHeader: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookMetadataOutput'
          description: ''
  /api/v1/dashboards/analytics/:
    get:
      operationId: v1_dashboards_analytics_retrieve
      description: |-
        Analytique adaptative au rôle (curé→paroisse, évêque→diocèse, archevêque→
        province). Flux de dons + fidèles, filtres spatio-temporels, bornée au périmètre.
      summary: Analytique scopée (dons + fidèles) — curé / évêque / archevêque
      parameters:
      - in: query
        name: diocese
        schema:
          type: integer
        description: 'Drill-down : diocèse (dans le périmètre)'
      - in: query
        name: from
        schema:
          type: string
          format: date-time
        description: Début (ISO) — prioritaire sur period
      - in: query
        name: granularity
        schema:
          type: string
        description: day|week|month (défaut month)
      - in: query
        name: parish
        schema:
          type: integer
        description: 'Drill-down : paroisse (dans le périmètre)'
      - in: query
        name: period
        schema:
          type: string
        description: today|week|month|quarter|year (défaut year)
      - in: query
        name: provider
        schema:
          type: string
        description: wave|orange_money|free_money|cash
      - in: query
        name: status
        schema:
          type: string
        description: Statut don (défaut confirmed)
      - in: query
        name: to
        schema:
          type: string
          format: date-time
        description: Fin (ISO)
      - in: query
        name: type
        schema:
          type: string
        description: Type de don (church_tithe, sunday_collection, …)
      tags:
      - dashboards
      security:
      - keycloakBearer: []
      - legacyJwt: []
      - session: []
      - sessionHeader: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/dashboards/analytics/activity/:
    get:
      operationId: v1_dashboards_analytics_activity_retrieve
      description: |-
        Matrice d'activité par sous-entité (paroisse/diocèse/église) + files en
        souffrance (documents/intentions). Même résolution de périmètre que /analytics/.
      summary: Matrice d'activité + files en souffrance (par périmètre)
      parameters:
      - in: query
        name: diocese
        schema:
          type: integer
        description: Drill-down diocèse
      - in: query
        name: from
        schema:
          type: string
          format: date-time
        description: Début (ISO)
      - in: query
        name: parish
        schema:
          type: integer
        description: Drill-down paroisse
      - in: query
        name: period
        schema:
          type: string
        description: today|week|month|quarter|year
      - in: query
        name: to
        schema:
          type: string
          format: date-time
        description: Fin (ISO)
      tags:
      - dashboards
      security:
      - keycloakBearer: []
      - legacyJwt: []
      - session: []
      - sessionHeader: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/dashboards/diocese/{diocese_id}/:
    get:
      operationId: v1_dashboards_diocese_retrieve
      summary: Tableau de bord diocésain (évêque)
      parameters:
      - in: path
        name: diocese_id
        schema:
          type: integer
        required: true
      tags:
      - dashboards
      security:
      - keycloakBearer: []
      - legacyJwt: []
      - session: []
      - sessionHeader: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/dashboards/global/:
    get:
      operationId: v1_dashboards_global_retrieve
      summary: Vue d'ensemble plateforme (super-admin uniquement)
      tags:
      - dashboards
      security:
      - keycloakBearer: []
      - legacyJwt: []
      - session: []
      - sessionHeader: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/dashboards/me/:
    get:
      operationId: v1_dashboards_me_retrieve
      summary: Tableau de bord du fidèle (vue personnelle)
      tags:
