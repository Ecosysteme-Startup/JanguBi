      - in: query
        name: offset
        schema:
          type: integer
        description: Décalage
      - in: query
        name: on_platform
        schema:
          type: boolean
          nullable: true
      - in: query
        name: q
        schema:
          type: string
          minLength: 1
        description: Nom, ville ou code
      - in: query
        name: type
        schema:
          type: string
          default: paroisse
          minLength: 1
      tags:
      - public
      security:
      - keycloakBearer: []
      - legacyJwt: []
