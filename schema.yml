    get:
      operationId: staff_documents_list
      description: À placer en premier dans les bases des vues V1.
      summary: File de traitement (actes.traiter)
      parameters:
      - in: query
        name: assignee
        schema:
          type: string
          minLength: 1
        description: « me » (moi), « none » (à assigner) ou l'identifiant d'une personne
      - in: query
        name: document_type
        schema:
          enum:
          - baptism
          - first_communion
          - confirmation
          - religious_marriage
          - godparent
          - other
          type: string
          minLength: 1
        description: |-
          * `baptism` - Certificat de baptême
          * `first_communion` - Attestation de première communion
          * `confirmation` - Attestation de confirmation
          * `religious_marriage` - Attestation de mariage religieux
          * `godparent` - Attestation parrain / marraine
          * `other` - Autre document
      - in: query
        name: limit
        schema:
          type: integer
        description: Nombre de résultats (défaut 10, max 50)
      - in: query
        name: node
        schema:
          type: string
          format: uuid
      - in: query
        name: offset
        schema:
          type: integer
        description: Décalage
      - in: query
        name: overdue
        schema:
          type: boolean
          default: false
      - in: query
        name: reason
        schema:
          enum:
          - religious_marriage
          - godparent
          - catechism
          - parish_file
          - personal
          - other
          type: string
          minLength: 1
        description: |-
          * `religious_marriage` - Mariage religieux
          * `godparent` - Parrain / marraine
          * `catechism` - Inscription catéchèse
          * `parish_file` - Dossier paroissial
          * `personal` - Usage personnel
          * `other` - Autre
      - in: query
        name: received_from
        schema:
          type: string
          format: date
        description: Reçue à partir de (inclus)
      - in: query
        name: received_to
        schema:
          type: string
          format: date
        description: Reçue jusqu'au (inclus)
      - in: query
        name: search
        schema:
          type: string
          minLength: 1
        description: Référence ou nom du demandeur
      - in: query
        name: status
        schema:
          enum:
          - submitted
          - under_verification
          - info_requested
          - ready_for_pickup
          - collected
          - rejected
          - cancelled
          type: string
          minLength: 1
        description: |-
          * `submitted` - Soumise
          * `under_verification` - En vérification
          * `info_requested` - Complément demandé
          * `ready_for_pickup` - Prête à retirer
          * `collected` - Retirée
          * `rejected` - Rejetée
          * `cancelled` - Annulée
      tags:
      - documents
      security:
      - keycloakBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedQueueItemList'
          description: ''
