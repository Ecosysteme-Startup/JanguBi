{# Bouton «&nbsp;à l'épreuve des clients mail&nbsp;» : cellule colorée + lien, lien en clair dessous. #}
<table role="presentation" class="btn-wrap" cellpadding="0" cellspacing="0" border="0">
  <tr><td class="btn-cell" align="center"><a class="btn" href="{{ url }}" target="_blank" rel="noopener">{{ label }}</a></td></tr>
</table>
{% if not sans_lien %}<p class="fallback">Si le bouton ne fonctionne pas, copiez ce lien dans votre navigateur :<br><a href="{{ url }}">{{ url }}</a></p>{% endif %}
