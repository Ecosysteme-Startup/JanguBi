# Banque de phrases des données de test (plan §5, « Textes ») : écrites à la main dans le ton de l'app
# (sobre, chaleureux, jamais culpabilisant ; pas d'emoji ; aucun classement). Combinées de façon
# déterministe par la graine. Textes rédigés pour le projet : aucun droit de tiers.

annonces:
  titres:
    - "Annonces du dimanche"
    - "La semaine à la paroisse"
    - "Annonces de la messe dominicale"
  lignes:
    - "Les inscriptions au catéchisme sont ouvertes au secrétariat, du mardi au samedi, de 9 h à 12 h."
    - "Réunion des parents des enfants de la première communion samedi à 16 h, salle Saint-Joseph."
    - "Adoration du Saint-Sacrement jeudi de 19 h à 20 h, suivie des confessions."
    - "La chorale accueille de nouvelles voix : répétition vendredi à 18 h 30."
    - "Les CEB se retrouvent cette semaine chez leurs responsables pour le partage de la Parole."
    - "Merci à toutes les personnes qui ont aidé au nettoyage de l'église samedi dernier."
    - "Le secrétariat sera fermé lundi ; les demandes d'actes reprennent mardi matin."
    - "Chapelet médité tous les soirs du mois de mai, à 18 h, devant la grotte."
    - "Les servants d'autel se retrouvent samedi à 10 h pour la répétition."
    - "Quête impérée dimanche prochain : elle sera intégralement reversée à la curie."
    - "Les jeunes préparent la veillée de louange : toutes les bonnes volontés sont les bienvenues."
    - "Visite des malades par l'équipe de la pastorale de la santé : signalez-nous les personnes isolées."
articles:
  - titre: "Inscriptions au catéchisme"
    texte: "Le catéchisme reprend pour les enfants et les adolescents. Les familles peuvent passer au secrétariat avec l'extrait de naissance et, le cas échéant, le certificat de baptême. Les catéchistes seront heureux de vous accueillir."
  - titre: "Retour sur la fête paroissiale"
    texte: "Merci à chacun pour cette belle journée : la messe, le repas partagé et les chants des enfants. Rendez-vous l'an prochain, dans la même joie."
  - titre: "Préparation au mariage"
    texte: "Les fiancés qui souhaitent se marier dans l'année sont invités à prendre contact avec le curé au moins six mois à l'avance. Un parcours de quatre rencontres est proposé."
  - titre: "Pèlerinage de Popenguine"
    texte: "Le pèlerinage marial approche. Les groupes de marcheurs se forment dans les CEB ; les personnes âgées pourront rejoindre le sanctuaire en car."
  - titre: "Journée de la pastorale de la santé"
    texte: "Une messe sera célébrée pour les malades et les soignants, avec le sacrement des malades pour ceux qui le demandent."
  - titre: "Travaux dans l'église"
    texte: "Des travaux d'entretien auront lieu cette semaine. Les messes de semaine seront célébrées à la chapelle."
meditations:
  - titre: "La foi comme une graine de moutarde"
    texte: "Jésus ne nous demande pas une foi immense, mais une foi vivante. Une petite graine, confiée à la terre, devient un arbre où les oiseaux viennent se poser."
  - titre: "Rester avec lui"
    texte: "Avant d'envoyer ses disciples, Jésus les appelle pour qu'ils soient avec lui. Prendre le temps de rester près de lui, c'est déjà répondre à son appel."
  - titre: "La paix donnée"
    texte: "La paix que le Christ nous laisse n'est pas l'absence de difficultés. C'est une présence qui demeure au milieu de nos journées."
  - titre: "Marcher ensemble"
    texte: "Sur la route d'Emmaüs, Jésus marche avec deux disciples découragés. Il écoute d'abord, puis il ouvre les Écritures. Il fait encore ainsi avec nous."
diocese:
  - titre: "Lettre de l'Archevêque pour la rentrée pastorale"
    texte: "Chers frères et sœurs, la rentrée pastorale nous invite à renouveler notre attention aux plus fragiles et à la vie de nos communautés."
  - titre: "Ordinations sacerdotales"
    texte: "L'archidiocèse se réjouit des ordinations prochaines. Prions pour les ordinands et pour les vocations."
  - titre: "Journée diocésaine de la jeunesse"
    texte: "Les jeunes de toutes les paroisses sont invités à une journée de rencontre, de prière et de partage."
global:
  - titre: "Bienvenue sur Jàngu Bi"
    texte: "Retrouvez la Parole du jour, la vie de votre paroisse et vos démarches, au même endroit."
