messages:
  # Fils courts, prêtre et fidèle. Aucun contenu de confession (RG-08).
  - - ["fidele", "Bonjour mon Père, je voudrais faire baptiser notre fille. Comment faut-il procéder ?"]
    - ["pretre", "Bonjour, quelle bonne nouvelle. Passez au secrétariat pour l'inscription ; la préparation a lieu le premier samedi du mois."]
    - ["fidele", "Merci beaucoup, nous passerons mardi."]
  - - ["fidele", "Bonsoir mon Père, mon père est hospitalisé à Fann. Serait-il possible de lui rendre visite ?"]
    - ["pretre", "Bonsoir. Bien sûr. Je peux passer jeudi après-midi. Dites-moi le service et la chambre."]
    - ["fidele", "Service de cardiologie, chambre 12. Merci de tout cœur."]
    - ["pretre", "Je prie pour lui. À jeudi."]
  - - ["fidele", "Bonjour, je souhaite demander une messe pour ma défunte mère. À qui dois-je m'adresser ?"]
    - ["pretre", "Bonjour, le secrétariat enregistre les intentions de messe. Vous pouvez aussi passer après la messe de 7 h."]
  - - ["fidele", "Mon Père, pouvons-nous nous voir pour parler de mon projet de mariage ?"]
    - ["pretre", "Avec joie. Je vous propose samedi à 11 h au presbytère."]
    - ["fidele", "C'est parfait, merci."]
  - - ["fidele", "Bonjour, je voudrais m'engager dans la pastorale de la santé. Qui dois-je contacter ?"]
    - ["pretre", "Merci pour votre disponibilité. La responsable est présente après la messe de 9 h 30, je vous présenterai."]
documents:
  motifs_complement:
    - "Merci de préciser l'année approximative du baptême et le nom du parrain."
    - "Le nom de jeune fille de la mère est nécessaire pour retrouver l'acte."
    - "Pouvez-vous joindre une copie de la pièce d'identité ?"
  motifs_rejet:
    - "Aucun acte correspondant n'a été trouvé dans nos registres. Le baptême a peut-être été célébré dans une autre paroisse."
homelies:
  # Textes lus en synthèse vocale pour les homélies, lectures et retraites (plan §5).
  - titre: "Homélie du dimanche : la graine de moutarde"
    texte: "Frères et sœurs, le Seigneur nous parle aujourd'hui d'une graine toute petite. Nous aimerions souvent une foi spectaculaire, capable de tout changer d'un coup. Mais le Royaume de Dieu grandit comme une graine confiée à la terre : lentement, en silence, sans que l'on sache comment. Ce qui compte, c'est de la semer chaque jour, dans nos familles, dans notre travail, dans nos quartiers. Que le Seigneur fasse grandir en nous ce qu'il y a semé."
  - titre: "Homélie : le bon Samaritain"
    texte: "Qui est mon prochain ? La question du docteur de la Loi est aussi la nôtre. Jésus ne répond pas par une définition. Il raconte une histoire, et il retourne la question : de qui vas-tu te faire proche ? Le Samaritain voit, il est saisi de compassion, il s'approche. Voir, être touché, s'approcher : voilà le chemin que le Seigneur nous propose cette semaine."
  - titre: "Homélie : les disciples d'Emmaüs"
    texte: "Ils marchaient tristes, et Jésus marchait avec eux sans qu'ils le reconnaissent. Combien de fois marchons-nous ainsi, découragés, sans voir qu'il est là ? Il nous rejoint par sa Parole, qui réchauffe le cœur, et par le pain rompu, qui ouvre les yeux. Chaque dimanche, nous refaisons ce chemin. Et, comme eux, nous sommes envoyés annoncer qu'il est vivant."
  - titre: "Retraite : apprendre à prier"
    texte: "Prier, ce n'est pas d'abord dire beaucoup de mots. C'est se tenir devant Dieu, tel que l'on est. Commencez par quelques minutes de silence. Confiez au Seigneur votre journée, ce qui vous réjouit et ce qui vous pèse. Puis laissez une parole de l'Évangile vous accompagner. La prière devient alors une amitié, et l'amitié grandit avec le temps."
  - titre: "Lecture : la parabole du semeur"
    texte: "Le semeur sortit pour semer. Une partie du grain tomba au bord du chemin, une autre sur le sol pierreux, une autre dans les ronces, une autre enfin dans la bonne terre, où elle donna du fruit. Que celui qui a des oreilles pour entendre, qu'il entende."
  - titre: "Méditation : Notre Père"
    texte: "Notre Père, qui es aux cieux, que ton nom soit sanctifié, que ton règne vienne, que ta volonté soit faite sur la terre comme au ciel. Donne-nous aujourd'hui notre pain de ce jour. Pardonne-nous nos offenses, comme nous pardonnons aussi à ceux qui nous ont offensés. Et ne nous laisse pas entrer en tentation, mais délivre-nous du Mal. Amen."
